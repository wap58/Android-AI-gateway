name: Build Release APK

# CI 测试版通道：手动触发 → 跑自检/单测 → 打 release 包 →
#   ① 上传 artifact（留档 14 天，可手动下载）
#   ② 覆盖发布到固定 tag `ci-latest` 的 Release（App「测试版」通道读的就是它）
# 正式版仍走 android-release.yml（创建 vX.Y.Z Release）。
#
# 为什么不给每个测试版单独发预发行 Release：
# 测试版天天变，逐个建 tag/Release 只会让 Release 列表变成垃圾堆，
# 而且 App 端还得在一堆版本里挑「最高版本」。
# 固定 tag + 覆盖资产 = 永远只有一个地址，App 记一个常量就行。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: 还原 release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"

      - name: 生成 keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 单元测试
        run: gradle :core:test --console=plain

      - name: 静态自检（括号平衡 / 空对象体 / 跨文件成员引用）
        run: python3 selfcheck.py

      - name: 读取版本号
        id: version
        run: |
          # 基版本取自 build.gradle（如 1.0.0），CI 包版本名带 -ci{run} 后缀：
          #   1.0.0 → 1.0.0-ci153
                    # 为什么用「ci + 递增数字」而不是 run_number 或第四段数字：
          #   1) 正式版保持三段（1.0.0），显示干净；
          #   2) 两个 CI 包之间靠计数器区分（ci.1 < ci.2 < ci.3）；
          #   3) isNewer() 数字段相同时按「带字母 = 测试版」判定，
          #      从 CI 版切回公开版能检测到正式版更新。
          # versionCode 单独递增（见下），覆盖安装靠它，不靠 versionName。
          BASE=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"(.*)".*/\1/')
          # ★ 先剥掉已有的 -ci.N：本地构建 CI 包时 versionName 会带着旧后缀，
          #   不剥就会拼出 1.0.0-ci.6-ci.4 这种双后缀。
          BASE=$(echo "$BASE" | sed -E 's/-ci\.[0-9]+$//')
          # 计数器：没有就从 1 起；每次构建 +1 并写回，随提交进入仓库
          CI_NO=$(cat .ci-build-number 2>/dev/null || echo 0)
          CI_NO=$((CI_NO + 1))
          echo "$CI_NO" > .ci-build-number
          VERSION="${BASE}-ci.${CI_NO}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "基版本 $BASE → CI 版本 $VERSION"
          sed -i -E "s/^(\s*versionName\s*=\s*)\".*\"/\1\"$VERSION\"/" app/build.gradle.kts
          # versionCode 必须递增：覆盖安装只认 code，同 code 装不上去。
          # 用 base + CI 计数器（不是 run_number）：run_number 会累加到几百，
          # 让 code 无意义地跳号。计数器每轮 +1，code 也就每轮 +1。
          BASE_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | head -n1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          NEWCODE=$((BASE_CODE + CI_NO))
          sed -i -E "s/^(\s*versionCode\s*=\s*)[0-9]+/\1$NEWCODE/" app/build.gradle.kts
          echo "versionCode $BASE_CODE → $NEWCODE"
          grep -E '^\s*(versionCode|versionName)' app/build.gradle.kts

      # 计数器改动要提交回仓库，否则下次构建又从旧值开始，ci 编号会重复。
      # 只在 CI 号的提交里出现，不影响源码改动历史。
      - name: 提交 CI 计数器
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@local"
          git add .ci-build-number
          git diff --cached --quiet || git commit -m "ci: 构建号 $(cat .ci-build-number)"
          git push || echo "推送计数器失败（可能是并发构建），不影响本次产物"

      - name: 打包 release
        run: gradle :app:assembleRelease --console=plain

      - name: 重命名产物
        run: cp app/build/outputs/apk/release/app-release.apk "tianyuanding-${{ steps.version.outputs.version }}.apk"

      - name: 上传 APK（artifact，留档可手动下载）
        uses: actions/upload-artifact@v4
        with:
          name: tianyuanding-${{ steps.version.outputs.version }}
          path: tianyuanding-${{ steps.version.outputs.version }}.apk
          retention-days: 14

      - name: 固定文件名（给测试通道用稳定直链）
        run: cp "tianyuanding-${{ steps.version.outputs.version }}.apk" tianyuanding-ci.apk

      - name: 更新测试通道（覆盖发布到 ci-latest）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: v${{ steps.version.outputs.version }}
          # 必须标 prerelease：GitHub 的 /releases/latest 会自动跳过预发布，
          # 公开版用户才不会收到 CI 包。这不是"预发行版本管理"，只是让这条通道对公开版不可见。
          prerelease: true
          # 不参与"最新版本"评选，避免和正式版的 latest 抢位置
          make_latest: 'false'
          body: |
            CI 测试版 · v${{ steps.version.outputs.version }}

            构建自 `${{ github.sha }}`（main 分支）。
            运行：[#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            > 该包由 CI 自动产出，未经过人工验证，可能带问题。要稳定请切回「公开版」通道。
          files: tianyuanding-ci.apk
